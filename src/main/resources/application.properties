# Banco de dados PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marcapasso3d}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sua_senha}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000

ia.api.key=${IA_API_KEY:}

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.sandbox=${MERCADOPAGO_SANDBOX:true}
mercadopago.payer-email-teste=${MERCADOPAGO_PAYER_EMAIL_TESTE:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
